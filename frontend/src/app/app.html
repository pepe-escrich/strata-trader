<div class="min-h-screen flex flex-col">
  <!-- Mobile-Optimized Header with Toolbar -->
  <p-toolbar styleClass="border-b shadow-sm">
    <ng-template pTemplate="start">
      <div class="flex items-center gap-2 md:gap-4">
        <!-- Hamburger Menu Button -->
        <p-button
          icon="pi pi-bars"
          [text]="true"
          [rounded]="true"
          severity="secondary"
          (onClick)="toggleSidebar()"
          size="large"
        />
        <i class="pi pi-chart-bar text-2xl md:text-3xl text-primary"></i>
        <div>
          <h1 class="text-lg md:text-2xl font-bold m-0">{{ title() }}</h1>
          <p class="text-xs md:text-sm m-0 hidden sm:block opacity-70">Advanced Crypto Trading Bot</p>
        </div>
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <div class="flex items-center gap-2">
        <p-button
          [text]="true"
          [rounded]="true"
          [icon]="darkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          [label]="darkMode() ? 'Light' : 'Dark'"
          severity="secondary"
          (onClick)="toggleDarkMode()"
          [pTooltip]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
          tooltipPosition="bottom"
          class="hidden sm:inline-flex"
        />
        <!-- Mobile: Icon only -->
        <p-button
          [text]="true"
          [rounded]="true"
          [icon]="darkMode() ? 'pi pi-sun' : 'pi pi-moon'"
          severity="secondary"
          (onClick)="toggleDarkMode()"
          class="inline-flex sm:hidden"
        />
      </div>
    </ng-template>
  </p-toolbar>

  <!-- Sidebar Navigation -->
  <p-drawer [(visible)]="sidebarVisible" [style]="{ width: '280px' }">
    <ng-template pTemplate="header">
      <div class="flex items-center gap-3">
        <i class="pi pi-chart-bar text-2xl text-primary"></i>
        <span class="font-bold text-xl">Menu</span>
      </div>
    </ng-template>

    <p-menu [model]="menuItems" styleClass="w-full border-none"></p-menu>
  </p-drawer>

  <!-- Main Content -->
  <main class="flex-1 p-2 sm:p-4">
    <div class="max-w-[1400px] mx-auto">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t p-3 md:p-4 text-center opacity-70 text-xs md:text-sm">
    <p class="hidden sm:block">StrataTrader v1 &copy; 2025 | Powered by PrimeNG & Tailwind CSS</p>
    <p class="sm:hidden">StrataTrader v1 &copy; 2025</p>
  </footer>
</div>
